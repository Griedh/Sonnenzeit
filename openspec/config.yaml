schema: spec-driven

context: |
  Maintain all repository artifacts in English; the app UI remains German.
  Sonnenzeit: offline Expo 54 / React Native app for Android and web, strict TypeScript.
  App.tsx displays an annual calendar for Erftstadt (50.81 N, 6.77 E).
  src/astronomy.ts calculates solar times and estimated seasons locally.
  Calendar dates and season markers use UTC; solar times display in Europe/Berlin.
  Initial year and today highlighting use the device timezone.
  Location selection, persistence, input validation and polar-day handling are absent.
  Checks: npm run check (specs, archived tasks, Vitest, types); GitLab then builds a test APK.
  Web: npm run build checks and exports a single-page bundle to dist; npm run preview serves it.
  Vercel uses vercel.json and Node 24; no server, runtime secrets or offline reload support.

rules:
  proposal:
    - Reuse existing capability names; state scope and non-goals.
  specs:
    - Specify observable behavior using SHALL (not MUST/SHOULD) and concrete WHEN/THEN scenarios.
    - Use the controlled English project terms in docs/spec-language/README.md; avoid vague, non-verifiable wording.
    - Keep observable behavior separate from implementation details.
    - Distinguish current behavior, limitations and proposed changes.
    - Include all retained scenarios in MODIFIED requirements.
  design:
    - Describe decisions and validation; consider offline operation and timezones.
  tasks:
    - Use small numbered checkboxes; include relevant tests, docs and npm run check.

operations:
  apply:
    guidance:
      - Read change artifacts first, keep them current and mark only completed tasks.
      - Run npm run check and verify affected UI scenarios.
  archive:
    guidance:
      - Archive only completed, verified changes; sync specs and run npm run check.
